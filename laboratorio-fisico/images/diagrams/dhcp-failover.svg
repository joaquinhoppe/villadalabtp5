<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" height="100%" style="background-color: #0b1329; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.5">FLUJO DE INTERACCIÓN DHCP FAILOVER CON CLIENTE DINÁMICO EN ETHER4</text>
  <text x="480" y="52" text-anchor="middle" fill="#94a3b8" font-size="12.5">Ciclo Real: Primario .227 ➔ Caída de Servicio ➔ Secundario .228 ➔ Recuperación ➔ Primario .227</text>

  <!-- Participant Lifeline Headers -->
  <!-- 1. Test Client Notebook in ether4 -->
  <g transform="translate(50, 72)">
    <rect width="240" height="54" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="120" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">💻 Cliente Dinámico (ether4)</text>
    <text x="120" y="42" text-anchor="middle" fill="#fcd34d" font-size="11">Sin reserva fija · Pool: .230-.238</text>
  </g>
  <line x1="170" y1="126" x2="170" y2="760" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 2. Primary Server (RPi) -->
  <g transform="translate(370, 72)">
    <rect width="230" height="54" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="115" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">🐧 Primary (Raspberry Pi)</text>
    <text x="115" y="42" text-anchor="middle" fill="#a7f3d0" font-size="11">eth0: 172.18.2.227 · split 256;</text>
  </g>
  <line x1="485" y1="126" x2="485" y2="760" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 3. Secondary Server (VM Linux) -->
  <g transform="translate(680, 72)">
    <rect width="230" height="54" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="115" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">🐧 Secondary (VM Ubuntu)</text>
    <text x="115" y="42" text-anchor="middle" fill="#c7d2fe" font-size="11">eth0: 172.18.2.228 · Standby</text>
  </g>
  <line x1="795" y1="126" x2="795" y2="760" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- PHASE 1: OPERACIÓN NORMAL (PRIMARIO ASIGNA) -->
  <rect x="370" y="140" width="540" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="640" y="157" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Socket TCP/647 Establecido — Estado: NORMAL / NORMAL (split 256;)</text>

  <!-- Step 1: DHCPDISCOVER -->
  <line x1="170" y1="188" x2="480" y2="188" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="310" y="181" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600">1. DHCPDISCOVER (Difusión en VLAN 80 desde ether4)</text>

  <!-- Step 1b: Secondary ignores -->
  <rect x="695" y="188" width="200" height="30" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="795" y="207" text-anchor="middle" fill="#cbd5e1" font-size="9.5">split 256; Secundario no contesta</text>

  <!-- Step 2: DHCPOFFER -->
  <line x1="485" y1="235" x2="175" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="310" y="228" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-weight="600">2. DHCPOFFER (IP Dinámica: 172.18.2.236 del pool)</text>

  <!-- Step 3: DHCPREQUEST -->
  <line x1="170" y1="265" x2="480" y2="265" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="310" y="258" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600">3. DHCPREQUEST (Acepta IP 172.18.2.236)</text>

  <!-- Step 4: DHCPACK -->
  <line x1="485" y1="295" x2="175" y2="295" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="310" y="288" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-weight="600">4. DHCPACK (Primario otorga lease · DHCP Server: 172.18.2.227)</text>

  <!-- Sync BNDUPD / BNDACK -->
  <line x1="485" y1="325" x2="790" y2="325" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="640" y="318" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">5. BNDUPD (Sincroniza lease .236 por TCP 647)</text>

  <line x1="795" y1="350" x2="490" y2="350" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="640" y="343" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">6. BNDACK (Confirmación de replicación)</text>

  <!-- PHASE 2: CAÍDA DEL PRIMARIO -->
  <g transform="translate(50, 375)">
    <rect width="860" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="430" y="23" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">💥 CAÍDA CONTROLADA: sudo systemctl stop isc-dhcp-server en Raspberry Pi (.227)</text>
  </g>

  <!-- Detection & Timeout -->
  <rect x="610" y="425" width="310" height="36" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1"/>
  <text x="765" y="441" text-anchor="middle" fill="#fef08a" font-size="10" font-weight="600">Timeout TCP 647 detectado por Secundario</text>
  <text x="765" y="454" text-anchor="middle" fill="#fde047" font-size="9.5">Estado: COMMUNICATIONS-INTERRUPTED</text>

  <!-- Client renews towards Secondary -->
  <line x1="170" y1="490" x2="790" y2="490" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="460" y="483" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600">7. DHCPREQUEST (Cliente ejecuta ipconfig /renew tras caída del Primario)</text>

  <!-- Secondary answers with MCLT -->
  <line x1="795" y1="525" x2="175" y2="525" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="460" y="517" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">8. DHCPACK de Contingencia (Secundario asume servicio · DHCP Server: 172.18.2.228 · MCLT)</text>

  <!-- PHASE 3: RECUPERACIÓN Y RESINCRONIZACIÓN -->
  <g transform="translate(50, 555)">
    <rect width="860" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="430" y="23" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">🟢 RESTAURACIÓN: sudo systemctl start isc-dhcp-server en Raspberry Pi (.227)</text>
  </g>

  <!-- Resync Handshake -->
  <line x1="485" y1="608" x2="790" y2="608" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="640" y="601" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">9. Re-Handshake TCP 647 &amp; Actualización de Leases</text>

  <line x1="795" y1="635" x2="490" y2="635" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="640" y="628" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">10. Sincronización Completa: my state normal; partner state normal;</text>

  <!-- Client renews and returns to Primary -->
  <line x1="170" y1="675" x2="480" y2="675" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="310" y="668" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600">11. DHCPREQUEST (Nueva renovación del cliente dinámico)</text>

  <line x1="485" y1="708" x2="175" y2="708" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="310" y="700" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">12. DHCPACK (El Primario reasume plenamente · DHCP Server: 172.18.2.227)</text>

  <!-- Restored status -->
  <rect x="220" y="735" width="520" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="753" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">CICLO COMPLETO VALIDADO CON CLIENTE DINÁMICO (.236): 🟢 PASS</text>
</svg>
