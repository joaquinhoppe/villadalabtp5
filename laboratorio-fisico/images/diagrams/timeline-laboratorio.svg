<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background-color: #0b1329; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">SECUENCIA DE CONSTRUCCIÓN Y VALIDACIÓN DEL LABORATORIO</text>
  <text x="480" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">Línea de tiempo progresiva desde el hardware en crudo hasta las alertas por Gmail</text>

  <!-- Central connecting spine line -->
  <path d="M 90 140 L 870 140 Q 910 140 910 200 L 910 210 Q 910 270 870 270 L 90 270 Q 50 270 50 330 L 50 340 Q 50 400 90 400 L 870 400"
        fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,6" opacity="0.4"/>

  <!-- Row 1: Phases 1 to 4 -->
  <!-- Phase 1 -->
  <g transform="translate(60, 95)" filter="url(#shadow)">
    <rect width="180" height="85" rx="8" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#1d4ed8"/>
    <rect x="0" y="14" width="180" height="8" fill="#1d4ed8"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 1 · Reset MikroTik</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">Hardening inicial</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">Descarte defconf DHCP</text>
    <text x="10" y="72" fill="#64748b" font-size="9">MAC-WinBox activo</text>
    <circle cx="90" cy="45" r="3" fill="#3b82f6"/>
  </g>

  <!-- Phase 2 -->
  <g transform="translate(280, 95)" filter="url(#shadow)">
    <rect width="180" height="85" rx="8" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#1d4ed8"/>
    <rect x="0" y="14" width="180" height="8" fill="#1d4ed8"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 2 · VLAN 80 Switch</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">Bridge VLAN Filtering</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">PVID 80 en ether2/ether3</text>
    <text x="10" y="72" fill="#f59e0b" font-size="9">SVI Staging 172.18.2.225</text>
  </g>

  <!-- Phase 3 -->
  <g transform="translate(500, 95)" filter="url(#shadow)">
    <rect width="180" height="85" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#059669"/>
    <rect x="0" y="14" width="180" height="8" fill="#059669"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 3 · RPi Primario</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">ISC DHCP en eth0</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">IP estática 172.18.2.227</text>
    <text x="10" y="72" fill="#10b981" font-size="9">10 Scopes corporativos</text>
  </g>

  <!-- Phase 4 -->
  <g transform="translate(720, 95)" filter="url(#shadow)">
    <rect width="180" height="85" rx="8" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#6d28d9"/>
    <rect x="0" y="14" width="180" height="8" fill="#6d28d9"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 4 · VM Secundario</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">VMware Bridged eth0</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">Enlace exclusivo Realtek</text>
    <text x="10" y="72" fill="#c4b5fd" font-size="9">Netplan: 172.18.2.228/28</text>
  </g>

  <!-- Row 2 (Right to Left): Phases 5 to 7 -->
  <!-- Phase 5 -->
  <g transform="translate(720, 225)" filter="url(#shadow)">
    <rect width="180" height="85" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#059669"/>
    <rect x="0" y="14" width="180" height="8" fill="#059669"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 5 · DHCP Failover</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">Socket TCP 647 Activo</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">Modo: split 256; (Hot-Standby)</text>
    <text x="10" y="72" fill="#10b981" font-size="9">Estado: normal / normal</text>
  </g>

  <!-- Phase 6 -->
  <g transform="translate(440, 225)" filter="url(#shadow)">
    <rect width="240" height="85" rx="8" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="22" rx="8" fill="#dc2626"/>
    <rect x="0" y="14" width="240" height="8" fill="#dc2626"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 6 · Validación de Falla y Reasunción</text>
    <text x="10" y="42" fill="#fca5a5" font-size="10.5" font-weight="600">Desconexión forzada ether3</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">Secundario: communications-interrupted</text>
    <text x="10" y="72" fill="#10b981" font-size="9">Entrega lease MCLT 600s + Recuperación</text>
  </g>

  <!-- Phase 7 -->
  <g transform="translate(160, 225)" filter="url(#shadow)">
    <rect width="240" height="85" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="22" rx="8" fill="#059669"/>
    <rect x="0" y="14" width="240" height="8" fill="#059669"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 7 · Reserva MAC Determinística</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">Notebook en 172.18.2.229</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">MAC: 00:e0:4c:36:0c:b2 fija</text>
    <text x="10" y="72" fill="#38bdf8" font-size="9">ipconfig release/renew exitoso</text>
  </g>

  <!-- Row 3: Phases 8 to 11 -->
  <!-- Phase 8 -->
  <g transform="translate(60, 355)" filter="url(#shadow)">
    <rect width="190" height="85" rx="8" fill="url(#cardBg)" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="22" rx="8" fill="#0284c7"/>
    <rect x="0" y="14" width="190" height="8" fill="#0284c7"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 8 · Uplink WAN 4G</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">wlan1 Station a iPhone</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">dhcp-options=hostname</text>
    <text x="10" y="72" fill="#38bdf8" font-size="9">Subred: 172.20.10.5/28 bound</text>
  </g>

  <!-- Phase 9 -->
  <g transform="translate(280, 355)" filter="url(#shadow)">
    <rect width="190" height="85" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="22" rx="8" fill="#059669"/>
    <rect x="0" y="14" width="190" height="8" fill="#059669"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 9 · NAT &amp; QoS</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">Masquerade en lista WAN</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">Simple Queue 2M/4M</text>
    <text x="10" y="72" fill="#10b981" font-size="9">Navegación real validada</text>
  </g>

  <!-- Phase 10 -->
  <g transform="translate(500, 355)" filter="url(#shadow)">
    <rect width="200" height="85" rx="8" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="22" rx="8" fill="#d97706"/>
    <rect x="0" y="14" width="200" height="8" fill="#d97706"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 10 · DDNS &amp; Diagnóstico</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">MikroTik Cloud FQDN</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">Diagnóstico NAT / CGNAT</text>
    <text x="10" y="72" fill="#fef3c7" font-size="9">Ensayo Port-Forward 2222 (Timeout)</text>
  </g>

  <!-- Phase 11 -->
  <g transform="translate(730, 355)" filter="url(#shadow)">
    <rect width="180" height="85" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#059669"/>
    <rect x="0" y="14" width="180" height="8" fill="#059669"/>
    <text x="10" y="16" fill="#ffffff" font-size="11" font-weight="700">FASE 11 · Netwatch &amp; Gmail</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">4 Sondas ICMP autónomas</text>
    <text x="10" y="58" fill="#94a3b8" font-size="9.5">SMTP TLS (smtp.gmail.com)</text>
    <text x="10" y="72" fill="#34d399" font-size="9">Alertas móviles recibidas</text>
  </g>

  <!-- Completed Badge -->
  <g transform="translate(380, 470)">
    <rect width="200" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10b981"/>
    <text x="35" y="21" fill="#ecfdf5" font-size="12" font-weight="700">11 FASES · 100% PASS</text>
  </g>
</svg>
