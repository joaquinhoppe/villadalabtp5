<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" height="100%" style="background-color: #0b1329; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">FLUJO DE SALIDA A INTERNET REAL Y CONTROL DE TRÁFICO</text>
  <text x="480" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">Trayecto de los paquetes desde los hosts locales (incluyendo cliente ether4) hacia la nube vía NAT y QoS</text>

  <!-- Node 1: VLAN 80 Local -->
  <g transform="translate(25, 78)" filter="url(#shadow)">
    <rect width="190" height="210" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="28" rx="10" fill="#065f46"/>
    <rect x="0" y="18" width="190" height="10" fill="#065f46"/>
    <text x="95" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">VLAN 80 SERVIDORES</text>
    <text x="95" y="50" text-anchor="middle" fill="#34d399" font-size="11.5" font-weight="700">172.18.2.224/28</text>
    <text x="95" y="70" text-anchor="middle" fill="#e2e8f0" font-size="10">• Notebook Host (.229)</text>
    <text x="95" y="88" text-anchor="middle" fill="#e2e8f0" font-size="10">• Raspberry Pi (.227)</text>
    <text x="95" y="106" text-anchor="middle" fill="#e2e8f0" font-size="10">• VM Linux (.228)</text>
    <text x="95" y="124" text-anchor="middle" fill="#fcd34d" font-size="10">• Cliente ether4 (.236)</text>

    <rect x="12" y="140" width="166" height="58" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="95" y="156" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="700">Prueba con Wi-Fi OFF</text>
    <text x="95" y="172" text-anchor="middle" fill="#ffffff" font-size="8.5">Cliente .236 navega 100%</text>
    <text x="95" y="186" text-anchor="middle" fill="#6ee7b7" font-size="8.5">a través de ether4 ➔ WAN</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="220" y1="180" x2="255" y2="180" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 2: MikroTik (Gateway + NAT + QoS) -->
  <g transform="translate(260, 78)" filter="url(#shadow)">
    <rect width="210" height="210" rx="10" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="28" rx="10" fill="#1d4ed8"/>
    <rect x="0" y="18" width="210" height="10" fill="#1d4ed8"/>
    <text x="105" y="19" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">GATEWAY MIKROTIK</text>
    <text x="105" y="52" text-anchor="middle" fill="#60a5fa" font-size="11.5" font-weight="700">SVI: 172.18.2.225</text>

    <rect x="12" y="66" width="186" height="42" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="105" y="82" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600">NAT Masquerade</text>
    <text x="105" y="97" text-anchor="middle" fill="#94a3b8" font-size="9.5">out-interface-list=WAN</text>

    <rect x="12" y="116" width="186" height="46" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="105" y="132" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="600">Simple Queue (QoS)</text>
    <text x="105" y="148" text-anchor="middle" fill="#fef3c7" font-size="9.5">Max Limit: 2M Subida / 4M Bajada</text>

    <rect x="12" y="168" width="186" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="105" y="188" text-anchor="middle" fill="#94a3b8" font-size="9.5">Target: 172.18.2.224/28</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="475" y1="180" x2="505" y2="180" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 3: iPhone Hotspot (Cellular Gateway) -->
  <g transform="translate(510, 78)" filter="url(#shadow)">
    <rect width="210" height="210" rx="10" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="28" rx="10" fill="#0284c7"/>
    <rect x="0" y="18" width="210" height="10" fill="#0284c7"/>
    <text x="105" y="19" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">IPHONE HOTSPOT 4G</text>

    <text x="105" y="52" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">Gateway Celular: 172.20.10.1</text>

    <rect x="12" y="66" width="186" height="42" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
    <text x="105" y="82" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600">Cliente wlan1 Station</text>
    <text x="105" y="97" text-anchor="middle" fill="#94a3b8" font-size="9.5">IP: 172.20.10.5/28 (DHCP)</text>

    <rect x="12" y="116" width="186" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="105" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10">Wi-Fi 2.4 GHz WPA2</text>
    <text x="105" y="148" text-anchor="middle" fill="#94a3b8" font-size="9.5">Maximizar compatibilidad ON</text>

    <rect x="12" y="168" width="186" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="105" y="188" text-anchor="middle" fill="#94a3b8" font-size="9.5">Subred: 172.20.10.0/28</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="725" y1="180" x2="755" y2="180" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 4: Internet Global -->
  <g transform="translate(760, 78)" filter="url(#shadow)">
    <rect width="175" height="210" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="28" rx="10" fill="#6d28d9"/>
    <rect x="0" y="18" width="175" height="10" fill="#6d28d9"/>
    <text x="87" y="19" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">INTERNET REAL</text>

    <text x="87" y="52" text-anchor="middle" fill="#c4b5fd" font-size="11.5" font-weight="700">WAN Pública</text>
    <text x="87" y="72" text-anchor="middle" fill="#f1f5f9" font-size="10">IP: 181.238.34.137</text>
    <text x="87" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">(Carrier CGNAT)</text>

    <rect x="12" y="112" width="151" height="42" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
    <text x="87" y="128" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Servicios Externos</text>
    <text x="87" y="143" text-anchor="middle" fill="#e2e8f0" font-size="9.5">DNS 8.8.8.8 · Google</text>

    <rect x="12" y="160" width="151" height="40" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
    <text x="87" y="176" text-anchor="middle" fill="#a78bfa" font-size="9.5" font-weight="600">DDNS Oficial</text>
    <text x="87" y="190" text-anchor="middle" fill="#cbd5e1" font-size="8">.sn.mynetname.net</text>
  </g>
</svg>
